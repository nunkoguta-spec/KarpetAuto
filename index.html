<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="google-site-verification" content="KODPVTqll5gcmhMIDYqdv5jsmcuQ-u10nE0pKojVnPE" />
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoKarpet | Luxury Bespoke Car Mats</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #050505; --gold: #c5a059; --text: #e0e0e0; --card: #111; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Navigation */
        nav { padding: 30px 10%; display: flex; justify-content: space-between; align-items: center; position: absolute; width: 100%; z-index: 10; }
        .logo { font-family: 'Oswald', sans-serif; font-size: 28px; letter-spacing: 2px; }
        .logo span { color: var(--gold); }

        /* Hero */
        .hero { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1603386329225-868f9b1ee6c9?q=80&w=2000'); background-size: cover; }
        .hero h1 { font-family: 'Oswald', sans-serif; font-size: 4rem; text-transform: uppercase; margin-bottom: 20px; }

        /* Filter Section */
        .section-filter { padding: 50px 10%; text-align: center; }
        .tabs { display: flex; justify-content: center; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .tab { padding: 10px 25px; border: 1px solid #333; background: transparent; color: white; cursor: pointer; transition: 0.3s; border-radius: 50px; }
        .tab.active, .tab:hover { background: var(--gold); border-color: var(--gold); color: black; }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; padding: 50px 10%; }
        .card { background: var(--card); padding: 20px; border: 1px solid #222; transition: 0.4s; }
        .card:hover { border-color: var(--gold); transform: translateY(-10px); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card h3 { margin: 15px 0; }
        .btn-wa { display: block; width: 100%; padding: 12px; border: 1px solid var(--gold); color: var(--gold); text-align: center; text-decoration: none; margin-top: 15px; transition: 0.3s; }
        .btn-wa:hover { background: var(--gold); color: black; }

        /* Floating WhatsApp Button */
        .wa-float {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            background-color: #25d366;
            padding: 15px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .wa-float:hover { transform: scale(1.1); }
        .wa-float img { width: 30px; height: 30px; display: block; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">AUTO<span>KARPET</span></div>
    </nav>

    <header class="hero">
        <div>
            <h1>Presisi & Elegansi</h1>
            <p>Interior mobil Anda, kini lebih mewah.</p>
        </div>
    </header>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/6281234567890?text=Halo%20AutoKarpet,%20saya%20ingin%20konsultasi%20karpet." class="wa-float" target="_blank">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
    </a>

    <section class="section-filter">
        <h2>Pilih Koleksi Berdasarkan Merek</h2>
        <div class="tabs">
            <button class="tab active" onclick="filter('Semua', this)">Semua</button>
            <button class="tab" onclick="filter('Toyota', this)">Toyota</button>
            <button class="tab" onclick="filter('Honda', this)">Honda</button>
            <button class="tab" onclick="filter('BMW', this)">BMW</button>
        </div>
    </section>

    <div class="grid" id="produk">
        <div class="card" data-brand="Toyota">
            <img src="https://images.unsplash.com/photo-1605330835409-58b29f046de8?w=500" alt="Zenix">
            <h3>Innova Zenix</h3>
            <a href="#" class="btn-wa" onclick="wa('Innova Zenix')">Pesan Sekarang</a>
        </div>
        <div class="card" data-brand="BMW">
            <img src="https://images.unsplash.com/photo-1580273916550-e323be2ae537?w=500" alt="BMW">
            <h3>BMW 3 Series</h3>
            <a href="#" class="btn-wa" onclick="wa('BMW 3 Series')">Pesan Sekarang</a>
        </div>
    </div>

    <script>
        function filter(brand, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.card').forEach(c => {
                c.style.display = (brand === 'Semua' || c.dataset.brand === brand) ? 'block' : 'none';
            });
        }
        function wa(item) {
            window.open(`https://wa.me/6281234567890?text=Saya tertarik dengan ${item}`);
        }
    </script>
</body>
</html>
